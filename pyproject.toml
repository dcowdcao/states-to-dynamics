# Installable package `spade` — replaces the source repo's sys.path injection.
# `pip install -e .` puts src/spade on the path so `import spade.*` resolves everywhere.
#
# Editable only. spade.common.paths anchors on a repo-root marker, so a non-editable
# install resolves into site-packages and fails at the first external-fork lookup.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spade"
version = "0.1.0"
description = "Sparsemax-Distance SAEs on OthelloGPT (Karvonen board-game protocol)"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# One dependency list, in requirements.txt, where each pin sits next to its reason.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
# Every package dir carries an __init__.py; final_validation fails the build if one doesn't.
namespaces = false
