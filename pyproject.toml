# Installable package `spade` — replaces the source repo's sys.path injection.
# `pip install -e .` puts src/spade on the path so `import spade.*` resolves everywhere.
#
# Editable only. spade.common.paths anchors on a repo-root marker, so a non-editable
# install resolves into site-packages and fails at the first external-fork lookup.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spade"
version = "0.1.0"
description = "Sparsemax-Distance SAEs on OthelloGPT (Karvonen board-game protocol)"
requires-python = ">=3.11,<3.12"
# dependencies = [...]  # regenerate from the working env; see requirements.txt

[tool.setuptools.packages.find]
where = ["src"]
# find_namespace, not find: seven subpackages in the source repo have no __init__.py and
# only import because src/ is on sys.path. Plain `find` drops them silently — the package
# installs, imports, and is missing half the studies.
namespaces = true
