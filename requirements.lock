# Every package `pip install -e .` needs, at the version spade_env runs: spade_env's pip freeze
# cut to requirements.txt's dependency closure (CPython 3.11). torch is the PyPI 2.5.1 wheel,
# which on Linux x86_64 is the +cu124 build; the CUDA runtime wheels and triton carry torch's own
# Linux x86_64 marker, so pip skips them anywhere else. To change a version, edit
# requirements.txt, build a clean venv from it, and re-freeze it here keeping those markers.
